<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A tape for you</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Someone made you a mixtape." />
<link rel="stylesheet" href="brand.css" />
<style>
/* ============================================================
   The recipient page. Same brand, quieter — this person is
   receiving something, not operating a tool.
   ============================================================ */

.masthead { text-align: center; margin-bottom: 34px; position: relative; }
.masthead .eyebrow {
  margin: 0 0 8px;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.3em; text-indent: 0.3em; text-transform: uppercase;
  color: var(--muted);
}
.masthead h1 {
  margin: 0;
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(38px, 8vw, 62px); line-height: 1;
}
.masthead h1 em { font-style: italic; }
.masthead .from {
  margin: 14px 0 0;
  font-family: var(--hand); font-weight: 700;
  font-size: 21px; color: var(--blue);
  transform: rotate(-1deg);
}

.stage { width: 100%; max-width: 820px; display: flex; flex-direction: column; align-items: center; }

/* ---------- the tape, with the player in its window ----------
   Wider than on the create page: here the tape is the hero, and the
   window has to stay a compliant player viewport. */
.sticker--tape { transform: rotate(-1deg); width: min(820px, 96vw); }

/* the tape is a real object with two sides, so it turns in 3D */
.tape-3d { perspective: 1600px; width: 100%; }

.cassette {
  position: relative; width: 100%; aspect-ratio: 1.575;
  transform-style: preserve-3d;
  will-change: transform;
}

.face {
  position: absolute; inset: 0;
  border-radius: 14px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: linear-gradient(180deg, var(--shell-light,#fff), var(--shell-base,#f2f0eb) 24%, var(--shell-dark,#c9c6bd));
  box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 6px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.22);
}
.face--b { transform: rotateY(180deg); }

/* Side B is not a recolour — it is the same tape, written later, in
   whatever pen was to hand, and it has sat in a drawer since. */
.face--b .label { background: var(--label-b); }
.face--b .label::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 38% 60% at 82% 30%, var(--paper-age), transparent 70%),
    radial-gradient(ellipse 24% 40% at 12% 78%, var(--paper-age), transparent 70%);
}
.face--b .label .title {
  color: var(--ink-b);
  transform: rotate(-1.4deg);
  letter-spacing: -0.01em;
}
.face--b .idle-note { color: rgba(255,255,255,.4); }
.screw { position: absolute; width: 15px; height: 15px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #d8d3c6, #6b6456 65%, #38332a);
  box-shadow: inset 0 -1px 2px rgba(0,0,0,.6); }
.screw::after { content: ""; position: absolute; inset: 3.5px; border-radius: 50%;
  background: linear-gradient(45deg, transparent 44%, rgba(20,16,10,.85) 46% 54%, transparent 56%),
              linear-gradient(-45deg, transparent 44%, rgba(20,16,10,.85) 46% 54%, transparent 56%); }
.screw.tl{top:11px;left:11px}.screw.tr{top:11px;right:11px}
.screw.bl{bottom:11px;left:11px}.screw.br{bottom:11px;right:11px}

.side-badge {
  position: absolute; left: 7%; top: 7%;
  z-index: 2;
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: .2em; text-indent: .2em;
  background: var(--ink); color: #fff;
  padding: 3px 9px; border-radius: 4px;
}
.face--b .side-badge { background: var(--ink-b); transform: rotate(-1.2deg); }

.label {
  position: absolute; left: 7%; right: 7%; top: 7%; height: 26%;
  border-radius: 7px; background: var(--label-bg, #fff);
  box-shadow: 0 1px 3px rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.14);
  overflow: hidden; color: var(--label-ink, #141414);
  display: flex; align-items: center; justify-content: center;
  padding: 0 18px;
}
.label .title {
  font-family: var(--hand); font-weight: 700;
  font-size: clamp(20px, 4vw, 30px); color: var(--write-ink, var(--blue));
  text-align: center; line-height: 1.1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%;
}

/* The player mount. Must stay visible and >=480x270 where the
   viewport allows — YouTube policy, see player.js. */
.window {
  position: absolute;
  left: 6%; right: 6%; top: 36%;
  height: 56%;
  border-radius: 10px;
  background: #15100c;
  box-shadow: inset 0 3px 9px rgba(0,0,0,.9), 0 0 0 2px rgba(255,255,255,.25);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.window iframe { width: 100%; height: 100%; border: 0; display: block; }

/* Below ~700px the cassette's 1.575 ratio would squeeze the window under
   YouTube's 200x200 floor, so the tape reflows instead of shrinking. */
@media (max-width: 700px) {
  /* Faces must stay absolutely positioned or the 3D flip breaks, so give
     the tape an explicit height rather than a ratio that would squeeze the
     player under YouTube's 200x200 floor. */
  .cassette { aspect-ratio: auto; height: 340px; }
  .label { top: 6%; height: 19%; }
  .window { top: 29%; height: 65%; }
}

/* idle state: the reels, until something plays */
.reels { display: flex; align-items: center; justify-content: center; gap: 16%; width: 100%; }
.reel { position: relative; width: 108px; height: 108px; flex: none; }
.reel .tape { position: absolute; inset: 0; border-radius: 50%;
  background: repeating-radial-gradient(circle at 50% 50%, #221710 0 3px, #2a1d13 3px 4px);
  box-shadow: inset 0 0 6px rgba(0,0,0,.8); }
.reel.small { transform: scale(.74); }
.reel .hub { position: absolute; inset: 30px; border-radius: 50%; background: #f0e9d8;
  box-shadow: inset 0 0 0 5px #c7bda5; animation: spin 3.2s linear infinite; }
.reel.small .hub { animation-duration: 2.1s; }
.reel .hub::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: linear-gradient(0deg,transparent 44%,#7a715c 46% 54%,transparent 56%),
              linear-gradient(60deg,transparent 44%,#7a715c 46% 54%,transparent 56%),
              linear-gradient(120deg,transparent 44%,#7a715c 46% 54%,transparent 56%); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .reel .hub { animation: none; } }

.window .idle-note {
  position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.45);
}

/* ---------- transport ---------- */
.transport {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin-top: 20px; flex-wrap: wrap;
}

.play-btn {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans); font-size: 13px; font-weight: 700;
  letter-spacing: .22em; text-indent: .22em; text-transform: uppercase;
  color: #fff; background: var(--ink); border: 1.6px solid var(--ink);
  border-radius: 999px; padding: 14px 28px;
  transition: background .15s ease, transform .1s ease;
}
.play-btn:hover { background: #000; }
.play-btn:active { transform: scale(.97); }
.play-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.play-btn .glyph { font-size: 15px; text-indent: 0; letter-spacing: 0; }

.step-btn {
  appearance: none; cursor: pointer;
  background: transparent; border: 1.4px solid var(--hairline);
  border-radius: 999px; width: 42px; height: 42px;
  color: var(--muted); font-size: 15px;
  transition: color .15s ease, border-color .15s ease;
}
.step-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); }
.step-btn:disabled { opacity: .35; cursor: default; }
.step-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.transport-note {
  flex-basis: 100%; text-align: center; margin: 4px 0 0;
  font-family: var(--mono); font-size: 12px; color: var(--muted);
}

/* the row currently playing, and its reason */
.tracks li.row.is-playing { background: rgba(43,63,212,.07); }
.tracks li.row.is-playing .t { color: var(--blue); }
.tracks li.row.is-playing .no::before { content: "▸ "; color: var(--blue); }
.tracks li.row.is-unavailable { opacity: .55; }
.tracks li.row.is-unavailable .t { text-decoration: line-through; }

.flip-btn {
  appearance: none; border: none; background: none; cursor: pointer;
  margin-top: 20px;
  font-family: var(--hand); font-weight: 700; font-size: 21px;
  color: var(--blue);
  padding: 6px 10px; border-radius: 8px;
  transform: rotate(-1deg);
  transition: color .15s ease, background .15s ease;
}
.flip-btn:hover { background: rgba(43,63,212,.07); }
.flip-btn[aria-pressed="true"] { color: var(--ink-b); }
.flip-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---------- the note ---------- */
.note-card { margin-top: 30px; width: min(620px, 94vw); transform: rotate(.6deg); }
.note-card p {
  margin: 0; font-family: var(--hand); font-weight: 700;
  font-size: 22px; line-height: 1.45; color: var(--blue);
}

/* ---------- the tracklist ---------- */
.list-card { margin-top: 26px; width: min(620px, 94vw); transform: rotate(-.5deg); padding: 26px 30px 24px; }
.list-card h2 {
  margin: 0 0 16px; font-family: var(--serif); font-weight: 400; font-size: 30px;
}
.list-card h2 em { font-style: italic; }

.tracks { list-style: none; margin: 0; padding: 0; }
.tracks .side-stamp {
  font-family: var(--hand); font-weight: 700; font-size: 17px;
  color: var(--blue); transform: rotate(-1deg); padding: 12px 0 4px;
}
.tracks li.row {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 9px;
  font-family: var(--mono); font-size: 15px;
  padding: 9px 6px 8px; border-bottom: 1px solid rgba(0,0,0,.1);
  border-radius: 6px;
}
.tracks li.row.is-playing { background: rgba(43,63,212,.07); }
.tracks .no { color: var(--muted); font-size: 12.5px; min-width: 22px; }
.tracks .t { font-weight: 700; }
.tracks .a { color: var(--muted); font-size: 13.5px; }
.tracks .out {
  margin-left: auto; flex: none;
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); text-decoration: none;
  border: 1.4px solid var(--hairline); border-radius: 999px; padding: 4px 11px;
}
.tracks .out:hover { color: var(--ink); border-color: var(--ink); }
.tracks .why {
  flex-basis: 100%; margin: 4px 0 1px 31px;
  font-family: var(--hand); font-weight: 700; font-size: 18px;
  line-height: 1.35; color: var(--blue);
}

/* ---------- footer ---------- */
.sig { margin-top: 26px; font-family: var(--hand); font-weight: 700; font-size: 20px; color: var(--blue); }
.make-back { margin-top: 30px; }

.empty {
  margin-top: 40px; text-align: center; max-width: 460px;
}
.empty h2 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 28px; margin: 0 0 10px; }
.empty p { color: var(--muted); font-size: 15px; margin: 0 0 22px; }

.doodle--heart { font-size: 26px; right: -30px; top: 0; transform: rotate(12deg); }
@media (max-width: 560px) { .doodle--heart { right: 2px; } }
</style>
</head>
<body>

  <div id="app" hidden>
    <header class="masthead">
      <p class="eyebrow">Someone made you</p>
      <h1><em id="tape-title">a mixtape</em></h1>
      <p class="from" id="tape-from"></p>
      <span class="doodle doodle--heart">♥</span>
    </header>

    <main class="stage">
      <div class="sticker sticker--tape">
        <div class="tape-3d">
          <div class="cassette" id="cassette">

            <div class="face face--a">
              <span class="screw tl"></span><span class="screw tr"></span>
              <span class="screw bl"></span><span class="screw br"></span>
              <span class="side-badge">SIDE A</span>
              <div class="label"><span class="title" id="label-title"></span></div>
              <div class="window" id="window">
                <div class="reels" id="reels">
                  <div class="reel"><div class="tape"></div><div class="hub"></div></div>
                  <div class="reel small"><div class="tape"></div><div class="hub"></div></div>
                </div>
                <span class="idle-note" id="idle-note"></span>
              </div>
            </div>

            <div class="face face--b">
              <span class="screw tl"></span><span class="screw tr"></span>
              <span class="screw bl"></span><span class="screw br"></span>
              <span class="side-badge">SIDE B</span>
              <div class="label"><span class="title" id="label-title-b"></span></div>
              <div class="window">
                <!-- played through: the full reel is now the other one -->
                <div class="reels">
                  <div class="reel small"><div class="tape"></div><div class="hub"></div></div>
                  <div class="reel"><div class="tape"></div><div class="hub"></div></div>
                </div>
                <span class="idle-note">the other half</span>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div class="transport" id="transport">
        <button class="step-btn" id="btn-prev" title="Previous" aria-label="Previous track" disabled>‹</button>
        <button class="play-btn" id="btn-play">
          <span class="glyph" id="play-glyph" aria-hidden="true">▶</span>
          <span id="play-label">Play the tape</span>
        </button>
        <button class="step-btn" id="btn-next" title="Next" aria-label="Next track" disabled>›</button>
        <p class="transport-note" id="transport-note" role="status"></p>
      </div>

      <button class="flip-btn" id="btn-flip" hidden aria-pressed="false">
        flip the tape ↻
      </button>

      <div class="sticker note-card" id="note-card" hidden>
        <p id="tape-note"></p>
      </div>

      <div class="sticker list-card">
        <h2>the <em id="list-side">A side</em></h2>
        <ol class="tracks" id="tracks"></ol>
      </div>

      <p class="sig" id="tape-sig"></p>

      <div class="make-back">
        <!-- ghost: play is the one filled pill on this page -->
        <a class="pill pill--ghost" href="index.html">Make one back</a>
      </div>
    </main>
  </div>

  <div class="empty" id="empty" hidden>
    <h2>there's no tape in this link.</h2>
    <p>the link may have been cut short somewhere between there and here — ask them to send it again.</p>
    <a class="pill" href="index.html">Make one of your own</a>
  </div>

  <footer class="footing">rewind · play · repeat</footer>

<script src="tape-codec.js"></script>
<script src="themes.js"></script>
<script src="cover.js"></script>
<script src="resolve.js"></script>
<script src="player.js"></script>
<script type="module">
import * as M from "./motion.js";
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const THEMES = window.THEMES;

  const SHELL = {
    studio:  { light:"#ffffff", base:"#f2f0eb", dark:"#c9c6bd", label:"#ffffff", ink:"#141414", write:"#2b3fd4" },
    shibuya: { light:"#ffffff", base:"#ece9e2", dark:"#b3aea1", label:"#f4f2ec", ink:"#241f3a", write:"#241f3a" },
    bombay:  { light:"#d05a52", base:"#a8262e", dark:"#6f1219", label:"#f7ecd4", ink:"#3d1c10", write:"#6b1430" },
    detroit: { light:"#fdf8ea", base:"#efe3c8", dark:"#c0ae8a", label:"#f6efdd", ink:"#3a2e25", write:"#7a2230" },
    camden:  { light:"#4c4c50", base:"#2a2a2c", dark:"#131315", label:"#f4f1e8", ink:"#131313", write:"#131313" },
  };

  function applyShell(theme) {
    const v = SHELL[theme.id] || SHELL.studio;
    const c = $("#cassette");
    c.style.setProperty("--shell-light", v.light);
    c.style.setProperty("--shell-base", v.base);
    c.style.setProperty("--shell-dark", v.dark);
    c.style.setProperty("--label-bg", v.label);
    c.style.setProperty("--label-ink", v.ink);
    c.style.setProperty("--write-ink", v.write);
  }

  /* Which entries belong to the side you are looking at. The flip is only
     meaningful if it actually changes what you can read. */
  function sideEntries(tape, side) {
    const aCount = Math.ceil(tape.songs.length / 2);
    const from = side === "B" ? aCount : 0;
    const to = side === "B" ? tape.songs.length : aCount;
    return tape.songs
      .map((song, i) => ({ song, i }))
      .slice(from, to);
  }

  function renderTracks(tape, side) {
    const ol = $("#tracks");
    ol.textContent = "";
    const rows = sideEntries(tape, side);

    rows.forEach(({ song, i }, n) => {
      if (n === 0) {
        const st = document.createElement("li");
        st.className = "side-stamp";
        st.textContent = side === "B" ? "side B —" : "side A —";
        ol.appendChild(st);
      }

      const li = document.createElement("li");
      li.className = song.unavailable ? "row is-unavailable" : "row";
      li.id = `row-${i}`;

      const no = document.createElement("span");
      no.className = "no";
      no.textContent = String(n + 1).padStart(2, "0");

      const t = document.createElement("span");
      t.className = "t"; t.textContent = song.title;

      const a = document.createElement("span");
      a.className = "a"; a.textContent = song.artist ? "— " + song.artist : "";

      li.append(no, t, a);

      // Always a way to hear it, resolved or not.
      const out = document.createElement("a");
      out.className = "out";
      out.target = "_blank";
      out.rel = "noopener noreferrer";
      out.href = window.Player.searchUrl(song);
      out.textContent = "listen";
      li.appendChild(out);

      if (song.reason) {
        const why = document.createElement("span");
        why.className = "why";
        why.textContent = song.reason;
        li.appendChild(why);
      }

      ol.appendChild(li);
    });

    $("#list-side").textContent = side === "B" ? "B side" : "A side";
  }

  let nowPlaying = -1;

  function markPlaying(i) {
    document.querySelectorAll(".tracks li.row").forEach((el) => el.classList.remove("is-playing"));
    if (i < 0) return;
    const el = document.getElementById(`row-${i}`);
    if (el) {
      el.classList.add("is-playing");
      el.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  async function boot() {
    let tape = null;
    try {
      tape = await window.TapeCodec.fromLocation();
    } catch (_) { tape = null; }

    if (!tape || !tape.songs.length) {
      $("#empty").hidden = false;
      return;
    }

    const theme = THEMES[tape.theme] || THEMES[0];
    const to = (tape.to || "").trim();
    const from = (tape.from || "").trim();

    document.title = tape.title ? `${tape.title} — a tape for you` : "A tape for you";
    $("#tape-title").textContent = tape.title || "a mixtape";
    $("#label-title").textContent = tape.title || "our mixtape";
    $("#tape-from").textContent = from ? `for ${to || "you"}, from ${from}` : `for ${to || "you"}`;

    if (tape.note) {
      $("#tape-note").textContent = `“${tape.note}”`;
      $("#note-card").hidden = false;
    }
    $("#tape-sig").textContent = from ? `with love, ${from} ♥` : "♥";

    applyShell(theme);
    $("#label-title-b").textContent = tape.title || "our mixtape";

    let side = "A";
    renderTracks(tape, side);
    $("#app").hidden = false;

    const aCount = Math.ceil(tape.songs.length / 2);
    const hasB = tape.songs.length > aCount;
    const flipBtn = $("#btn-flip");
    let flipping = false;

    /* Turn the tape. Used by the button and by playback crossing into side B. */
    async function setSide(next) {
      if (flipping || side === next) return;
      flipping = true;
      side = next;
      flipBtn.setAttribute("aria-pressed", String(side === "B"));
      flipBtn.textContent = side === "B" ? "back to side A ↻" : "flip the tape ↻";
      const listCard = document.querySelector(".list-card");
      await Promise.all([
        M.flip($("#cassette"), side === "B"),
        M.crossFade(listCard, () => renderTracks(tape, side)),
      ]);
      flipping = false;
      markPlaying(nowPlaying);
    }

    if (hasB) {
      flipBtn.hidden = false;
      flipBtn.addEventListener("click", () => setSide(side === "A" ? "B" : "A"));
    }

    M.settleAll(document.querySelectorAll(".masthead, .sticker, .flip-btn:not([hidden]), .sig, .make-back"));

    /* ---------- playback ---------- */

    const playBtn = $("#btn-play");
    const playGlyph = $("#play-glyph");
    const playLabel = $("#play-label");
    const prevBtn = $("#btn-prev");
    const nextBtn = $("#btn-next");
    const tNote = $("#transport-note");

    const { playable, total } = window.Player.init($("#window"), tape.songs, {
      onIndex: async (entryIndex, entry) => {
        nowPlaying = entryIndex;
        // playback crossing into side B turns the tape with it
        const wantSide = entryIndex < aCount ? "A" : "B";
        if (wantSide !== side) await setSide(wantSide);
        markPlaying(entryIndex);
        prevBtn.disabled = false;
        nextBtn.disabled = false;
      },
      onState: (playing) => {
        playGlyph.textContent = playing ? "❚❚" : "▶";
        playLabel.textContent = playing ? "Pause" : "Play the tape";
      },
      onUnavailable: (entry) => {
        entry.unavailable = true;
        renderTracks(tape, side);
        markPlaying(nowPlaying);
      },
      onBlocked: () => {
        $("#idle-note").textContent = "tap listen on any track";
        tNote.textContent = "this network won't let the player load — every track still has a link";
        playBtn.disabled = true;
      },
      onNeedsGesture: () => {
        tNote.textContent = "tap play once more to start the sound";
      },
      onEnd: () => {
        playGlyph.textContent = "▶";
        playLabel.textContent = "Play from the start";
        tNote.textContent = "that's the whole tape";
      },
    });

    if (!playable) {
      // nothing resolved yet — the tape is still complete, just not playable here
      playBtn.disabled = true;
      $("#idle-note").textContent = "tap listen on any track";
      tNote.textContent = total
        ? "these aren't matched to a recording yet — tap listen on any track"
        : "";
    } else {
      if (playable < total) {
        tNote.textContent = `${playable} of ${total} ready to play`;
      }
      playBtn.addEventListener("click", async () => {
        if (window.Player.isPlaying()) return window.Player.pause();
        tNote.textContent = "";
        const res = await window.Player.play();
        if (!res.ok && res.reason === "api-unavailable") {
          tNote.textContent = "this network won't let the player load — every track still has a link";
        }
      });
      prevBtn.addEventListener("click", () => window.Player.prev());
      nextBtn.addEventListener("click", () => window.Player.next());
    }
  }

  boot();
})();
</script>
</body>
</html>
